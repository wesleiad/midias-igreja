appId: com.wesleiad.midias-igreja
productName: Mídias - Igreja
directories:
  buildResources: build
files:
  - "out/**"
  - "package.json"
win:
  icon: build/icon.png
  target:
    - target: nsis
  artifactName: Midias-Igreja-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Mídias - Igreja
publish:
  provider: github
  owner: wesleiad
  repo: midias-igreja
  releaseType: release
