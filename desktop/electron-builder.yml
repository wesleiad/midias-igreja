appId: com.wesleiad.fotos-comvida
productName: Fotos Com.Vida
directories:
  buildResources: build
files:
  - "out/**"
  - "package.json"
win:
  icon: build/icon.png
  target:
    - target: nsis
  artifactName: Fotos-ComVida-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Fotos Com.Vida
