    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd889"/><stop offset="100%" stop-color="#f5a524"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f5a524" stop-opacity=".32"/><stop offset="100%" stop-color="#f5a524" stop-opacity="0"/></radialGradient>
    <linearGradient id="aro" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a2c33"/><stop offset="100%" stop-color="#0e0f12"/></linearGradient>
    <radialGradient id="vidro" cx="42%" cy="38%" r="70%"><stop offset="0%" stop-color="#2b3140"/><stop offset="100%" stop-color="#07080a"/></radialGradient>
  </defs>
  <circle cx="256" cy="262" r="170" fill="url(#glow)"/>
