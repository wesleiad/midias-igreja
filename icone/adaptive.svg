  <g transform="translate(256 286) scale(0.29) translate(-500 -508)">
    <clipPath id="gota"><path d="M500 290 C 470 330, 334 470, 334 560 A166 166 0 0 0 666 560 C 666 470, 530 330, 500 290 Z"/></clipPath>
